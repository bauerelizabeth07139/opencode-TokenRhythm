name: Validate preset config

on:
  push:
    branches: [main, master]
    paths:
      - 'opencode.jsonc'
      - 'mcp/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'opencode.jsonc'
      - 'mcp/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate opencode.jsonc (JSONC syntax, provider/models, no hardcoded keys)
        run: python scripts/validate_config.py
